repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: orchestrator-mypy
        name: Orchestrator strict typing
        entry: uvx --with typeguard --with types-PyYAML --with types-jsonschema --with boto3-stubs[cognito-idp,ssm] --with chromadb==1.5.2 --with ollama==0.6.1 mypy --strict plugins/agent-teams-workforce/orchestrator
        language: system
        files: ^plugins/agent-teams-workforce/(orchestrator|scripts/portfolio|skills/(beads-contract|wsjf)/scripts)/.*\.py$
        pass_filenames: false
      - id: checkpoint-contract-fresh
        name: Generated checkpoint contract matches its schema
        entry: uv run --no-project --python 3.14 python plugins/agent-teams-workforce/skills/artifact-handoff/scripts/generate_checkpoint_contract.py --check
        language: system
        files: ^(plugins/agent-teams-workforce/skills/artifact-handoff/(schemas/checkpoint\.schema\.json|scripts/(checkpoint_contract|generate_checkpoint_contract)\.py)|\.pre-commit-config\.yaml)$
        pass_filenames: false
      - id: checkpoint-contract-mypy
        name: Checkpoint contract strict typing
        entry: uvx mypy --strict plugins/agent-teams-workforce/skills/artifact-handoff/scripts/checkpoint_contract.py plugins/agent-teams-workforce/skills/artifact-handoff/scripts/generate_checkpoint_contract.py
        language: system
        files: ^plugins/agent-teams-workforce/skills/artifact-handoff/scripts/(checkpoint_contract|generate_checkpoint_contract)\.py$
        pass_filenames: false
      - id: driver-producer-contracts
        name: Real pipeline producer contracts
        entry: uv run --no-project --python 3.14 --with typeguard python plugins/agent-teams-workforce/orchestrator/check_driver_contracts.py
        language: system
        files: ^(plugins/agent-teams-workforce/(orchestrator|scripts/portfolio|skills/(beads-contract|wsjf)/scripts)/.*\.py|\.pre-commit-config\.yaml|mypy\.ini)$
        pass_filenames: false
      - id: specialist-catalog-fresh
        name: Specialist catalog matches the agent definitions
        entry: uv run --no-project --python 3.14 --with pyyaml python plugins/agent-teams-workforce/skills/find-specialists/scripts/specialist_catalog.py generate --check
        language: system
        files: ^(plugins/agent-teams-workforce/(agents/.*\.md|skills/find-specialists/.*)|\.pre-commit-config\.yaml)$
        pass_filenames: false
      - id: agent-output-formats
        name: Agent definitions match the schemas their outputs are checked against
        entry: node plugins/agent-teams-workforce/scripts/check-agent-output-formats.mjs
        language: system
        files: ^(plugins/agent-teams-workforce/(agents/.*\.md|skills/.*|workflows/.*\.js|orchestrator/(flows|core)/.*\.py|scripts/portfolio/.*\.py|scripts/check-agent-output-formats\.mjs)|\.pre-commit-config\.yaml)$
        pass_filenames: false
