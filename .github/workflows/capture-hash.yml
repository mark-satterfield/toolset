name: Capture Commit Hash

on:
  push:
    branches:
      - main

jobs:
  write-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PUSH }}

      - name: Update trailing hash line in agents-file.md
        run: |
          FILE="plugins/agent-teams-workforce/agents-file.md"
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          new=$(awk -v h="$SHORT" '
            NR==1 && $0=="---" { infm=1; print; next }
            infm && $0=="---" { if (!found) print "hash: " h; infm=0; print; next }
            infm && /^hash:[[:space:]]*/ { print "hash: " h; found=1; next }
            { print }
          ' "$FILE")
          printf '%s\n' "$new" > "$FILE"

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          message: 'chore: update agents-file hash [skip ci]'
          add: 'plugins/agent-teams-workforce/agents-file.md'
          push: true
