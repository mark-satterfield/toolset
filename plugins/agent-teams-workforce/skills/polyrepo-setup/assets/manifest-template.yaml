# Polyrepo Steward — Manifest Template
#
# This is the starting scaffold filled in by the setup workflow.
# Replace every <PLACEHOLDER> with the actual value, or remove the
# field if it does not apply.
#
# See ../../polyrepo-repo/references/manifest-schema.md for the full schema and validation
# rules. The manifest holds only the steward's own facts and copies it can check against disk and
# GitHub: what the project is, its conventions, its owners and what a repository is for are
# other documents' and the matrix's, and the manifest holds none of them.

schema_version: 6

project:
  name: <project-name>
  # No purpose and no owners. No created_at / last_updated — git history is the audit trail.

# No topology section. A local_path, a layout description, and this
# file's own location are all facts the steward's tool derives live
# from disk — recording them here is a hardcoded, stale-prone copy of
# something the filesystem already answers.

repos:
  - id: <GitHub node id>        # `gh repo view <owner>/<repo> --json id`; the name is read live
    # A planned repository not yet on GitHub records `name: <repo-name>` instead of `id`.
    # No local_path, name or remote_url: the tool reads them live from disk and GitHub.
    # No purpose, role, owner, language, notes or default_branch: what a repo is for is the
    # matrix's, and the repository and GitHub hold the rest.
    lifecycle: <active | maintenance | deprecated | archived | planned>
    tier: <product | tooling>   # product: holds product code; tooling: builds the product and holds none

# Repos closely related but not strictly part of this project.
# Optional. Remove this section if not needed.
adjacent_repos: []

# Named sets of repos chosen by judgment. Optional: add a group only when a set needs a name that the
# repository type (the last token of the name) does not give. Every member is the `id` of an entry above.
groups: []

# No `relationships`, `conventions`, `ownership`, `rules`, `documentation` or `search_recipes`
# sections. A shared contract, a dependency, a rule or a convention lives in the architecture
# documentation, the matrix or the control repository's AGENTS.md and .claude/rules/; where to
# find an answer is a pointer in .polyrepo/knowledge.yaml (owned by polyrepo-info). Restating
# any of them here duplicates their one canonical home and lets the copy drift.

# Optional: tuning notes for the steward itself, e.g., things the
# human has asked you to stop doing or always do for this project.
steward_preferences: []
