<!-- ============================================================
     S11 — 3-up stacked pull-quotes   (serves T3 Validation Block)
     Three quote blocks stacked vertically, NO card framing.
     Attribution under each. Variants shown: per-quote logo + metric callout.
     ============================================================ -->
<section
  data-theme="clarity"
  aria-labelledby="s11-heading"
  style="
    background: var(--role-surface-primary);
    color: var(--role-text-primary);
    padding: var(--section-pad-main) var(--container-margin);
  ">
  <div style="max-width: var(--container-small); margin: 0 auto;">

    <!-- Section eyebrow + heading -->
    <header style="max-width: var(--reading-column); margin: 0 0 var(--sp-4);">
      <p class="micro" style="color: var(--role-accent-primary); margin: 0 0 var(--sp-1);">
        Why teams choose us
      </p>
      <h2 id="s11-heading" class="h2" style="margin: 0; max-width: 18ch;">
        The teams shipping fastest are already on the Acme Platform.
      </h2>
    </header>

    <!-- Stacked pull-quotes — hairline-divided, no card surface -->
    <div role="list">

      <!-- Quote 1 — with logo + metric callout -->
      <figure
        role="listitem"
        style="
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
          gap: var(--sp-3);
          align-items: start;
          margin: 0;
          padding: var(--sp-3) 0;
          border-top: 1px solid var(--role-border-subtle);
        ">
        <div>
          <!-- Per-quote logo (inline svg wordmark) -->
          <div aria-label="Northwind" style="margin: 0 0 var(--sp-1-5); color: var(--role-text-secondary);">
            <svg width="118" height="22" viewBox="0 0 118 22" role="img" aria-label="Northwind logo" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1" y="4" width="14" height="14" rx="3" fill="var(--role-accent-primary)"/>
              <rect x="5.5" y="8.5" width="5" height="5" rx="1.2" fill="var(--color-neutral-000)"/>
              <text x="24" y="16" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="currentColor" letter-spacing="0.2">Northwind</text>
            </svg>
          </div>
          <blockquote class="display-2" style="font-size: var(--type-h3); font-weight: var(--fw-400); line-height: var(--lh-130); margin: 0; max-width: 28ch; text-wrap: balance;">
            &ldquo;We replaced four internal tools with one workspace. Onboarding a new engineer used to take a week&nbsp;&mdash; now they ship on day one.&rdquo;
          </blockquote>
          <figcaption style="margin: var(--sp-1-5) 0 0; display: flex; align-items: center; gap: var(--sp-0-75);">
            <span aria-hidden="true" style="display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--color-panel-sky); color: var(--color-neutral-950); font-weight: var(--fw-600); font-size: var(--type-body-3);">DR</span>
            <span style="display: flex; flex-direction: column;">
              <span class="body-2" style="font-weight: var(--fw-600); color: var(--role-text-primary);">Dana Reyes</span>
              <span class="body-3" style="color: var(--role-text-tertiary);">VP Engineering, Northwind</span>
            </span>
          </figcaption>
        </div>
        <!-- Metric callout -->
        <div style="text-align: left; padding-left: var(--sp-3); border-left: 1px solid var(--role-border-subtle);">
          <span style="display: block; font-family: var(--font-serif); font-size: var(--type-display-2); font-weight: var(--fw-500); line-height: var(--lh-100); color: var(--role-accent-primary);">5&times;</span>
          <span class="body-3" style="display: block; margin-top: var(--sp-0-5); color: var(--role-text-secondary); max-width: 20ch;">faster engineer onboarding</span>
        </div>
      </figure>

      <!-- Quote 2 — with logo + metric callout -->
      <figure
        role="listitem"
        style="
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
          gap: var(--sp-3);
          align-items: start;
          margin: 0;
          padding: var(--sp-3) 0;
          border-top: 1px solid var(--role-border-subtle);
        ">
        <div>
          <div aria-label="Globex" style="margin: 0 0 var(--sp-1-5); color: var(--role-text-secondary);">
            <svg width="98" height="22" viewBox="0 0 98 22" role="img" aria-label="Globex logo" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="11" r="7.5" stroke="var(--role-accent-primary)" stroke-width="2.4"/>
              <path d="M9 6.5v9M4.5 11h9" stroke="var(--role-accent-primary)" stroke-width="1.6"/>
              <text x="24" y="16" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="currentColor" letter-spacing="0.2">Globex</text>
            </svg>
          </div>
          <blockquote class="display-2" style="font-size: var(--type-h3); font-weight: var(--fw-400); line-height: var(--lh-130); margin: 0; max-width: 28ch; text-wrap: balance;">
            &ldquo;The audit trail alone paid for the year. Compliance reviews that took two analysts a full quarter now close in an afternoon.&rdquo;
          </blockquote>
          <figcaption style="margin: var(--sp-1-5) 0 0; display: flex; align-items: center; gap: var(--sp-0-75);">
            <span aria-hidden="true" style="display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--color-panel-mineral); color: var(--color-neutral-050); font-weight: var(--fw-600); font-size: var(--type-body-3);">MO</span>
            <span style="display: flex; flex-direction: column;">
              <span class="body-2" style="font-weight: var(--fw-600); color: var(--role-text-primary);">Marcus Okafor</span>
              <span class="body-3" style="color: var(--role-text-tertiary);">Head of Risk, Globex</span>
            </span>
          </figcaption>
        </div>
        <div style="text-align: left; padding-left: var(--sp-3); border-left: 1px solid var(--role-border-subtle);">
          <span style="display: block; font-family: var(--font-serif); font-size: var(--type-display-2); font-weight: var(--fw-500); line-height: var(--lh-100); color: var(--role-accent-primary);">92%</span>
          <span class="body-3" style="display: block; margin-top: var(--sp-0-5); color: var(--role-text-secondary); max-width: 20ch;">less time on compliance review</span>
        </div>
      </figure>

      <!-- Quote 3 — with logo + metric callout -->
      <figure
        role="listitem"
        style="
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(180px, 280px);
          gap: var(--sp-3);
          align-items: start;
          margin: 0;
          padding: var(--sp-3) 0;
          border-top: 1px solid var(--role-border-subtle);
          border-bottom: 1px solid var(--role-border-subtle);
        ">
        <div>
          <div aria-label="Acme" style="margin: 0 0 var(--sp-1-5); color: var(--role-text-secondary);">
            <svg width="84" height="22" viewBox="0 0 84 22" role="img" aria-label="Acme logo" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 18L9 4l7 14H12.4L9 11.2 5.6 18H2z" fill="var(--role-accent-primary)"/>
              <text x="24" y="16" font-family="var(--font-sans)" font-size="15" font-weight="600" fill="currentColor" letter-spacing="0.2">Acme</text>
            </svg>
          </div>
          <blockquote class="display-2" style="font-size: var(--type-h3); font-weight: var(--fw-400); line-height: var(--lh-130); margin: 0; max-width: 28ch; text-wrap: balance;">
            &ldquo;What sold our team was the rollout. We had three regions live in a single sprint with no migration scripts and zero downtime.&rdquo;
          </blockquote>
          <figcaption style="margin: var(--sp-1-5) 0 0; display: flex; align-items: center; gap: var(--sp-0-75);">
            <span aria-hidden="true" style="display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--color-panel-fig); color: var(--color-neutral-050); font-weight: var(--fw-600); font-size: var(--type-body-3);">PL</span>
            <span style="display: flex; flex-direction: column;">
              <span class="body-2" style="font-weight: var(--fw-600); color: var(--role-text-primary);">Priya Lall</span>
              <span class="body-3" style="color: var(--role-text-tertiary);">Director of Platform, Acme</span>
            </span>
          </figcaption>
        </div>
        <div style="text-align: left; padding-left: var(--sp-3); border-left: 1px solid var(--role-border-subtle);">
          <span style="display: block; font-family: var(--font-serif); font-size: var(--type-display-2); font-weight: var(--fw-500); line-height: var(--lh-100); color: var(--role-accent-primary);">0</span>
          <span class="body-3" style="display: block; margin-top: var(--sp-0-5); color: var(--role-text-secondary); max-width: 20ch;">minutes of downtime at rollout</span>
        </div>
      </figure>

    </div>
  </div>
</section>
