<!-- Shape S12 — Quote swiper with logos (serves T3 Validation Block) -->
<!-- Slots: rotating quote viewport (one quote at a time with attribution); paired logo carousel beneath. -->
<!-- Layout: quote block stacked above logo carousel; both rotate in sync. -->
<!-- Variant demonstrated: auto-advance ON (the active slide is shown live); metric-per-quote ON. -->
<!-- This is a static visual proof: the "active" slide is rendered, the others are queued in the carousel. -->
<section
  data-theme="punctuation"
  aria-label="Validation block — quote swiper with logos shape proof"
  aria-roledescription="carousel"
  style="background: var(--role-surface-primary); padding: var(--section-pad-main) var(--container-margin); overflow: hidden;"
>
  <div style="max-width: var(--container-small); margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);">

    <!-- Eyebrow label for the validation block -->
    <span class="micro" style="color: var(--role-accent-primary);">Trusted in production</span>

    <!-- ============================================================= -->
    <!-- QUOTE VIEWPORT — one quote visible at a time -->
    <!-- ============================================================= -->
    <div
      role="group"
      aria-roledescription="slide"
      aria-label="Quote 2 of 6"
      style="position: relative; width: 100%; text-align: center; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-2);"
    >
      <!-- Decorative opening quote mark -->
      <svg width="56" height="44" viewBox="0 0 56 44" aria-hidden="true" focusable="false"
           style="color: var(--role-accent-primary); flex: none;">
        <path fill="currentColor" d="M0 44V26.7C0 18.4 1.9 11.8 5.7 6.9 9.5 2 15 .3 22.1.8l1.2 8.4c-3.6.2-6.4 1.4-8.3 3.6-2 2.2-3 5.1-3.1 8.8H23V44H0Zm33 0V26.7c0-8.3 1.9-14.9 5.7-19.8C42.5 2 48 .3 55.1.8l1.2 8.4c-3.6.2-6.4 1.4-8.3 3.6-2 2.2-3 5.1-3.1 8.8H56V44H33Z"/>
      </svg>

      <!-- The rotating quote text (serif, near-hero scale) -->
      <blockquote class="display-2" style="margin: 0; max-width: 24ch; color: var(--role-text-primary); font-weight: var(--fw-400);">
        We replaced four disconnected tools with one workspace and gave every launch a single source of truth.
      </blockquote>

      <!-- Metric callout (variant: with metric per quote) -->
      <div style="display: inline-flex; align-items: baseline; gap: var(--sp-0-75); padding: var(--sp-0-5) var(--sp-1-5); background: var(--role-surface-raised); border: 1px solid var(--role-border-subtle); border-radius: 9999px;">
        <span style="font-family: var(--font-serif); font-size: var(--type-h4); font-weight: var(--fw-600); color: var(--role-accent-primary); line-height: 1;">41%</span>
        <span class="body-3" style="color: var(--role-text-secondary);">faster time-to-launch</span>
      </div>

      <!-- Attribution: name / role / org with inline logo -->
      <figcaption style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-0-25);">
        <span class="body-2" style="font-weight: var(--fw-600); color: var(--role-text-primary);">Dana Whitfield</span>
        <span class="body-3" style="color: var(--role-text-tertiary);">VP of Operations, Northwind</span>
      </figcaption>
    </div>

    <!-- ============================================================= -->
    <!-- LOGO CAROUSEL — rotates in sync with the quote viewport -->
    <!-- The active logo (index 2 = Northwind) is highlighted; the -->
    <!-- rest are dimmed, representing the queued slides. -->
    <!-- ============================================================= -->
    <div
      role="group"
      aria-label="Customer logos, in sync with quotes"
      style="width: 100%; display: flex; align-items: center; justify-content: center; gap: var(--sp-3); flex-wrap: wrap; padding-top: var(--sp-1-5); border-top: 1px solid var(--role-border-subtle);"
    >
      <!-- Logo 1 — Acme (dimmed / queued) -->
      <span aria-label="Acme" style="display: inline-flex; align-items: center; opacity: 0.4; transition: opacity var(--dur-300) var(--ease-in-out);">
        <svg width="96" height="26" viewBox="0 0 96 26" role="img" aria-label="Acme">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor" style="color: var(--role-text-primary);">Acme</text>
        </svg>
      </span>

      <!-- Logo 2 — Northwind (ACTIVE / in sync with shown quote) -->
      <span aria-current="true" aria-label="Northwind, current" style="display: inline-flex; align-items: center; opacity: 1; color: var(--role-text-primary);">
        <svg width="138" height="26" viewBox="0 0 138 26" role="img" aria-label="Northwind">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">Northwind</text>
        </svg>
      </span>

      <!-- Logo 3 — Globex (dimmed / queued) -->
      <span aria-label="Globex" style="display: inline-flex; align-items: center; opacity: 0.4; color: var(--role-text-primary);">
        <svg width="108" height="26" viewBox="0 0 108 26" role="img" aria-label="Globex">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">Globex</text>
        </svg>
      </span>

      <!-- Logo 4 — Initech (dimmed / queued) -->
      <span aria-label="Initech" style="display: inline-flex; align-items: center; opacity: 0.4; color: var(--role-text-primary);">
        <svg width="104" height="26" viewBox="0 0 104 26" role="img" aria-label="Initech">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">Initech</text>
        </svg>
      </span>

      <!-- Logo 5 — Hooli (dimmed / queued) -->
      <span aria-label="Hooli" style="display: inline-flex; align-items: center; opacity: 0.4; color: var(--role-text-primary);">
        <svg width="80" height="26" viewBox="0 0 80 26" role="img" aria-label="Hooli">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">Hooli</text>
        </svg>
      </span>

      <!-- Logo 6 — Vandelay (dimmed / queued) -->
      <span aria-label="Vandelay" style="display: inline-flex; align-items: center; opacity: 0.4; color: var(--role-text-primary);">
        <svg width="128" height="26" viewBox="0 0 128 26" role="img" aria-label="Vandelay">
          <text x="0" y="20" font-family="Host Grotesk, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">Vandelay</text>
        </svg>
      </span>
    </div>

    <!-- ============================================================= -->
    <!-- SWIPER CONTROLS — prev/next + synced pagination dots -->
    <!-- Dot index 2 is active (matches quote + logo above). -->
    <!-- ============================================================= -->
    <div style="display: flex; align-items: center; gap: var(--sp-1-5);">
      <!-- Previous -->
      <button type="button" class="button button-tertiary" aria-label="Previous quote"
              style="width: 40px; min-height: 40px; padding: 0; border-radius: 9999px;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path d="M11.25 3.75 6 9l5.25 5.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Pagination dots (one per quote, dot 2 active) -->
      <div role="tablist" aria-label="Select quote" style="display: flex; align-items: center; gap: var(--sp-0-75);">
        <span role="tab" aria-label="Quote 1" style="width: 8px; height: 8px; border-radius: 9999px; background: var(--role-border-subtle);"></span>
        <span role="tab" aria-selected="true" aria-label="Quote 2, current" style="width: 24px; height: 8px; border-radius: 9999px; background: var(--role-accent-primary);"></span>
        <span role="tab" aria-label="Quote 3" style="width: 8px; height: 8px; border-radius: 9999px; background: var(--role-border-subtle);"></span>
        <span role="tab" aria-label="Quote 4" style="width: 8px; height: 8px; border-radius: 9999px; background: var(--role-border-subtle);"></span>
        <span role="tab" aria-label="Quote 5" style="width: 8px; height: 8px; border-radius: 9999px; background: var(--role-border-subtle);"></span>
        <span role="tab" aria-label="Quote 6" style="width: 8px; height: 8px; border-radius: 9999px; background: var(--role-border-subtle);"></span>
      </div>

      <!-- Next -->
      <button type="button" class="button button-tertiary" aria-label="Next quote"
              style="width: 40px; min-height: 40px; padding: 0; border-radius: 9999px;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path d="M6.75 3.75 12 9l-5.25 5.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Auto-advance affordance label (variant: auto-advance ON) -->
    <span class="caption" style="color: var(--role-text-tertiary); display: inline-flex; align-items: center; gap: var(--sp-0-5);">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
        <circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M6 3v3l2 1.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      Auto-advancing every 6 seconds
    </span>

  </div>
</section>
