<!-- ==========================================================================
     Landing shape S9 — Marquee strip   (serves T2 Trust Strip)
     Continuously scrolling horizontal row of brand-neutral logo wordmarks.
     content_meta: item_count = 14 (logos only, ≥ 10 → S9). Items duplicated
     to fill the loop; scroll left; pause-on-hover.
     Ground: §19.2 second-section rule, one step lighter (clarity, neutral-000).
     Uses only design-system tokens + classes; one scoped <style> for the
     keyframe marquee (no external assets, renders offline).
     ========================================================================== -->
<section
  data-theme="clarity"
  aria-labelledby="s9-trust-heading"
  style="
    background: var(--role-surface-primary);
    color: var(--role-text-primary);
    padding-block: var(--section-pad-small);
    overflow: hidden;
  ">

  <style>
    /* Scoped to this fragment only. Marquee = one continuous left scroll over a
       track that holds the logo set twice; translating -50% lands seamlessly. */
    .s9-strip { position: relative; }

    .s9-viewport {
      overflow: hidden;
      /* edge fade so logos dissolve into the ground at both rails */
      -webkit-mask-image: linear-gradient(
        to right, transparent 0, #000 var(--container-margin),
        #000 calc(100% - var(--container-margin)), transparent 100%);
      mask-image: linear-gradient(
        to right, transparent 0, #000 var(--container-margin),
        #000 calc(100% - var(--container-margin)), transparent 100%);
    }

    .s9-track {
      display: flex;
      align-items: center;
      gap: var(--sp-5);
      width: max-content;
      padding-block: var(--sp-1);
      animation: s9-marquee 48s linear infinite;
      will-change: transform;
    }
    .s9-strip:hover .s9-track,
    .s9-strip:focus-within .s9-track { animation-play-state: paused; }

    @keyframes s9-marquee {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }

    .s9-logo {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      color: var(--role-text-secondary);
      opacity: 0.78;
      transition: color var(--dur-200) var(--ease-in-out),
                  opacity var(--dur-200) var(--ease-in-out);
    }
    .s9-logo:hover,
    .s9-logo:focus-visible {
      color: var(--role-text-primary);
      opacity: 1;
      outline: none;
    }
    .s9-logo svg { display: block; height: 100%; width: auto; }
    .s9-logo svg [fill="currentColor"],
    .s9-logo svg path,
    .s9-logo svg rect,
    .s9-logo svg circle,
    .s9-logo svg text { fill: currentColor; }

    /* second marquee row scrolls the opposite way for visual rhythm */
    .s9-track--rev { animation-name: s9-marquee-rev; animation-duration: 56s; }
    @keyframes s9-marquee-rev {
      from { transform: translate3d(-50%, 0, 0); }
      to   { transform: translate3d(0, 0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .s9-track, .s9-track--rev {
        animation: none;
        transform: none;
        flex-wrap: wrap;
        justify-content: center;
        row-gap: var(--sp-2);
      }
      .s9-viewport { -webkit-mask-image: none; mask-image: none; }
    }
  </style>

  <!-- Eyebrow + framing line (centered, container-small measure) -->

      max-width: var(--container-small);
      margin-inline: auto;
      padding-inline: var(--container-margin);
