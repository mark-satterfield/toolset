<section class="cds-shape" data-shape="S2" aria-labelledby="s2-heading" style="padding-block: var(--section-pad-main); background: var(--role-surface-primary); color: var(--role-text-primary);">
  <div style="max-width: 1192px; margin-inline: auto; padding-inline: clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px);">
    <div class="cds-shape__split" style="display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 32px; row-gap: var(--sp-4); align-items: center;">

      <!-- Text column — grid columns 1-6 -->
      <div class="cds-shape__text" style="grid-column: span 6; display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1-5);">
        <p class="outline-pill-badge" style="margin: 0; border-radius: var(--radius-xs);">Workflow automation</p>
        <h2 id="s2-heading" style="margin: 0; font-family: var(--font-sans); font-size: clamp(28px, calc(28px + 12 * (100vw - 320px) / 1120), 40px); font-weight: 600; line-height: 1.1; text-wrap: balance; color: var(--role-text-primary);">
          Move work forward without leaving your editor
        </h2>
        <p style="margin: 0; max-width: 48ch; font-family: var(--font-sans); font-size: 18px; line-height: 1.5; color: var(--role-text-secondary);">
          Connect your repositories, define a few rules, and let routine reviews resolve themselves. Your team stays focused on the decisions that need real judgment.
        </p>
        <div class="cds-shape__cta-pair" style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1); margin-top: var(--sp-0-75);">
          <button type="button" class="button-base button-primary">Start a free trial</button>
          <button type="button" class="button-base button-tertiary">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px;"><path d="M6.5 3.5H4a1 1 0 00-1 1V12a1 1 0 001 1h7.5a1 1 0 001-1V9.5M9.5 3.5H13V7M13 3.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>View documentation
          </button>
        </div>
      </div>

      <!-- Visual column — grid columns 7-12 -->
      <div class="cds-shape__visual" style="grid-column: span 6;">
        <figure style="margin: 0; width: 100%; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--role-border-subtle); background: var(--role-surface-secondary);">
          <img
            src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22720%22%20height%3D%22520%22%20viewBox%3D%220%200%20720%20520%22%20role%3D%22img%22%3E%3Crect%20width%3D%22720%22%20height%3D%22520%22%20fill%3D%22%23e8e6dc%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%2240%22%20width%3D%22640%22%20height%3D%2256%22%20rx%3D%2210%22%20fill%3D%22%23d1cfc5%22%2F%3E%3Crect%20x%3D%2240%22%20y%3D%22128%22%20width%3D%22300%22%20height%3D%22344%22%20rx%3D%2210%22%20fill%3D%22%23d1cfc5%22%2F%3E%3Crect%20x%3D%22372%22%20y%3D%22128%22%20width%3D%22308%22%20height%3D%22160%22%20rx%3D%2210%22%20fill%3D%22%23d1cfc5%22%2F%3E%3Crect%20x%3D%22372%22%20y%3D%22312%22%20width%3D%22308%22%20height%3D%22160%22%20rx%3D%2210%22%20fill%3D%22%23d1cfc5%22%2F%3E%3C%2Fsvg%3E"
            alt="Dashboard preview showing a queue of automated review tasks alongside two summary panels"
            style="display: block; width: 100%; height: auto;" />
        </figure>
      </div>

    </div>
  </div>

  <style>
    @media (max-width: 699px) {
      .cds-shape[data-shape="S2"] .cds-shape__split {
        grid-template-columns: repeat(2, 1fr);
      }
      .cds-shape[data-shape="S2"] .cds-shape__text,
      .cds-shape[data-shape="S2"] .cds-shape__visual {
        grid-column: 1 / -1;
      }
      .cds-shape[data-shape="S2"] .cds-shape__cta-pair {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</section>
