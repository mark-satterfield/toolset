<section class="cds-shape" data-shape="S11" aria-label="What teams are saying" style="padding-block:var(--section-pad-small); padding-inline:clamp(32px, 5vw, 64px); background:var(--role-surface-primary);">
  <div style="max-width:960px; margin-inline:auto; display:flex; flex-direction:column; align-items:center; gap:var(--sp-5);">

    <figure style="margin:0; display:flex; flex-direction:column; align-items:center; gap:var(--sp-1-5); text-align:center;">
      <blockquote style="margin:0; max-width:36ch; font:500 clamp(24px, 3vw, 32px)/1.25 var(--font-serif); color:var(--role-text-primary); text-wrap:balance;">
        &ldquo;Rollout that used to eat a full sprint now lands in an afternoon. The whole team trusts the system to do the boring parts correctly.&rdquo;
      </blockquote>
      <figcaption style="display:flex; flex-direction:column; gap:var(--sp-0-25); font:400 14px/1.4 var(--font-sans); color:var(--role-text-tertiary);">
        <cite style="font-style:normal; font-weight:600; color:var(--role-text-secondary);">Dana Okonkwo</cite>
        <span>Head of Platform, Northwind Logistics</span>
      </figcaption>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; align-items:center; gap:var(--sp-1-5); text-align:center;">
      <span aria-hidden="true" style="display:flex; flex-direction:column; align-items:center; gap:var(--sp-0-25);">
        <span style="font:700 clamp(40px, 6vw, 56px)/1 var(--font-sans); color:var(--role-accent-primary);">3.4&times;</span>
        <span style="font:400 13px/1.3 var(--font-sans); color:var(--role-text-tertiary);">faster review cycles</span>
      </span>
      <blockquote style="margin:0; max-width:36ch; font:500 clamp(24px, 3vw, 32px)/1.25 var(--font-serif); color:var(--role-text-primary); text-wrap:balance;">
        &ldquo;We stopped arguing about implementation details and started shipping. Consistency stopped being a debate and became the default.&rdquo;
      </blockquote>
      <figcaption style="display:flex; flex-direction:column; gap:var(--sp-0-25); font:400 14px/1.4 var(--font-sans); color:var(--role-text-tertiary);">
        <cite style="font-style:normal; font-weight:600; color:var(--role-text-secondary);">Marcus Vélez</cite>
        <span>VP Engineering, Lumen Grid</span>
      </figcaption>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; align-items:center; gap:var(--sp-1-5); text-align:center;">
      <blockquote style="margin:0; max-width:36ch; font:500 clamp(24px, 3vw, 32px)/1.25 var(--font-serif); color:var(--role-text-primary); text-wrap:balance;">
        &ldquo;Onboarding a new designer used to mean weeks of context. Now they pick up the conventions on day one and contribute by the end of the week.&rdquo;
      </blockquote>
      <figcaption style="display:flex; flex-direction:column; align-items:center; gap:var(--sp-0-75); font:400 14px/1.4 var(--font-sans); color:var(--role-text-tertiary);">
        <span aria-hidden="true" style="display:inline-flex; align-items:center; gap:var(--sp-0-5);">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" role="presentation">
            <rect x="1" y="1" width="18" height="18" rx="5" stroke="var(--role-border-strong)" stroke-width="1.5"></rect>
            <path d="M6 13L10 5L14 13" stroke="var(--role-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span style="font:600 14px/1 var(--font-sans); color:var(--role-text-secondary); letter-spacing:0.02em;">Apex Studio</span>
        </span>
        <span style="display:flex; flex-direction:column; gap:var(--sp-0-25);">
          <cite style="font-style:normal; font-weight:600; color:var(--role-text-secondary);">Priya Raman</cite>
          <span>Design Director, Apex Studio</span>
        </span>
      </figcaption>
    </figure>

  </div>
</section>
