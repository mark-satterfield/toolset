<section class="cds-shape" data-shape="S18" aria-labelledby="s18-headline" style="background:var(--role-surface-primary); color:var(--role-text-primary); padding-block:var(--section-pad-large); padding-inline:clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px);">
  <div style="max-width:1440px; margin-inline:auto; display:flex; justify-content:center;">

    <header style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:var(--sp-1-5); max-width:760px;">
      <h2 id="s18-headline" style="margin:0; font:600 clamp(34px, calc(34px + 18 * (100vw - 320px) / 1120), 52px)/1.1 var(--font-sans); letter-spacing:-0.01em; text-wrap:balance; color:var(--role-text-primary);">
        Ready to move your whole team to the connected workspace?
      </h2>

      <p style="margin:0; max-width:60ch; font:400 clamp(17px, calc(17px + 2 * (100vw - 320px) / 1120), 19px)/1.5 var(--font-sans); color:var(--role-text-secondary);">
        Download the desktop app to keep drafts in sync offline, or upgrade your plan to bring every project, review, and release into one shared surface.
      </p>

      <div style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:var(--sp-1); margin-top:var(--sp-0-75);">
        <button type="button" class="button-base button-primary">Upgrade your plan</button>
        <button type="button" class="button-base button-tertiary">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align:-2px; margin-right:6px;"><path d="M8 2.5v8M4.5 7l3.5 3.5L11.5 7M3 13h10" stroke-linecap="round" stroke-linejoin="round"/></svg>Download the desktop app
        </button>
      </div>
    </header>

  </div>
</section>
