<section class="cds-shape" data-shape="S28" aria-labelledby="s28-headline" style="background:var(--role-surface-primary); color:var(--role-text-primary); padding-block:var(--section-pad-main, 96px); padding-inline:clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px);">
  <div class="cds-shape__split" style="max-width:1440px; margin-inline:auto; display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:32px; align-items:center;">

    <figure class="cds-shape__media" style="grid-column:span 6; margin:0; min-width:0;">
      <video controls preload="metadata" playsinline poster="" style="display:block; width:100%; aspect-ratio:16 / 9; object-fit:cover; border-radius:var(--radius-xl, 16px); background:var(--role-tile-ground-1); color:var(--role-tile-ink-1);">
        <source src="connected-workspace-overview.mp4" type="video/mp4">
        <track kind="captions" srclang="en" label="English" default src="connected-workspace-overview.en.vtt">
        Your browser does not support embedded video. A two-minute overview of the connected workspace is available as a captioned download.
      </video>
      <figcaption style="margin-top:var(--sp-0-75, 12px); font:400 13px/1.4 var(--font-sans); color:var(--role-text-tertiary);">
        A two-minute look at how planning, drafts, and review stay in sync.
      </figcaption>
    </figure>

    <div class="cds-shape__panel" style="grid-column:span 6; min-width:0; display:flex; flex-direction:column; gap:var(--sp-1, 16px);">
      <h2 id="s28-headline" style="margin:0; font:600 clamp(28px, calc(28px + 14 * (100vw - 320px) / 1120), 42px)/1.15 var(--font-sans); text-wrap:balance; color:var(--role-text-primary);">
        See every change move from idea to release
      </h2>

      <p style="margin:0; max-width:52ch; font:400 clamp(16px, calc(16px + 2 * (100vw - 320px) / 1120), 18px)/1.55 var(--font-sans); color:var(--role-text-secondary);">
        Watch a single review thread carry context across planning, drafts, and approvals, so the team always knows what shipped and why.
      </p>

      <div class="cds-shape__cta-pair" style="display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-1, 16px); margin-top:var(--sp-0-75, 12px);">
        <a href="#start" class="button-base button-primary" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Start building</a>
        <a href="#tour" class="button-base button-tertiary" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align:-2px; margin-right:6px;"><path d="M6.5 4.5l5 3.5-5 3.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>Take the guided tour
        </a>
      </div>
    </div>

  </div>

  <style>
    @media (max-width: 699px) {
      .cds-shape[data-shape="S28"] .cds-shape__split {
        grid-template-columns: 1fr;
      }
      .cds-shape[data-shape="S28"] .cds-shape__media,
      .cds-shape[data-shape="S28"] .cds-shape__panel {
        grid-column: 1 / -1;
      }
      .cds-shape[data-shape="S28"] .cds-shape__cta-pair {
        flex-direction: column;
        align-items: stretch;
      }
      .cds-shape[data-shape="S28"] .cds-shape__cta-pair > .button-base {
        width: 100%;
      }
    }
  </style>
</section>
