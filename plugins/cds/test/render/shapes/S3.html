<section class="cds-shape" data-shape="S3" aria-labelledby="s3-heading" style="background: var(--role-surface-primary); color: var(--role-text-primary); padding-top: var(--section-pad-main); padding-bottom: var(--section-pad-main);">
  <div style="max-width: 960px; margin: 0 auto; padding-left: clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px); padding-right: clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px); display: flex; flex-direction: column; align-items: center; text-align: center;">

    <span class="outline-pill-badge" style="margin-bottom: var(--sp-0-75);">Now in preview</span>

    <h2 id="s3-heading" style="margin: 0; max-width: 720px; text-wrap: balance; font-family: var(--font-sans); font-weight: 600; font-size: clamp(2rem, calc(2rem + 1 * (100vw - 320px) / 1120), 3rem); line-height: 1.1; color: var(--role-text-primary);">Start building with a single command</h2>

    <p style="margin: var(--sp-1) 0 0; max-width: 560px; font-family: var(--font-sans); font-size: clamp(1rem, calc(1rem + 0.125 * (100vw - 320px) / 1120), 1.125rem); line-height: 1.55; color: var(--role-text-secondary);">Describe what you want to make and the workspace scaffolds the project, wires up the toolkit, and opens a live preview.</p>

    <!-- Embedded affordance: a single chat input. S3 permits exactly one affordance (chat input, install/code snippet, or prompt chips). -->
    <form role="search" aria-label="Describe what you want to build" style="width: 100%; max-width: 720px; margin-top: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-1);">
      <div style="display: flex; align-items: stretch; gap: var(--sp-0-5); width: 100%; padding: var(--sp-0-5); background: var(--role-surface-raised); border: 1px solid var(--role-border-subtle); border-radius: var(--radius-lg);">
        <label for="s3-prompt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Describe what you want to build</label>
        <input id="s3-prompt" class="standard-text-input" type="text" placeholder="Build a dashboard that tracks weekly active users…" autocomplete="off" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; box-shadow: none;">
        <button type="submit" class="button-base button-primary" style="flex: 0 0 auto;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px;"><path d="M2.5 8h9M8 4.5 11.5 8 8 11.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Generate
        </button>
      </div>
      <p style="margin: 0; font-family: var(--font-sans); font-size: 13px; line-height: 1.4; color: var(--role-text-tertiary);">No setup required. Press Enter or pick a starting point below.</p>
    </form>

    <!-- Supporting prompt chips: quick-fill suggestions that populate the affordance above. -->
    <ul aria-label="Suggested starting points" style="list-style: none; margin: var(--sp-1-5) 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-0-75); max-width: 720px;">
      <li>
        <button type="button" class="outline-pill-badge" style="cursor: pointer;">Internal admin panel</button>
      </li>
      <li>
        <button type="button" class="outline-pill-badge" style="cursor: pointer;">Customer support inbox</button>
      </li>
      <li>
        <button type="button" class="outline-pill-badge" style="cursor: pointer;">Usage analytics dashboard</button>
      </li>
      <li>
        <button type="button" class="outline-pill-badge" style="cursor: pointer;">Onboarding checklist flow</button>
      </li>
    </ul>

    <!-- CTAs sit below the affordance: the affordance is the section's primary action. -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1); margin-top: var(--sp-2-5);">
      <a href="#" class="button-base button-tertiary" style="text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px;"><path d="M6.5 3.5H4a1 1 0 0 0-1 1V12a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V9.5M9.5 3.5H13V7M13 3.5l-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>Read the quickstart
      </a>
    </div>

  </div>
</section>
