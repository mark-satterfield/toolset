<section class="cds-shape" data-shape="S19" aria-labelledby="s19-headline" style="background:var(--role-surface-secondary); padding-top:clamp(128px, calc(128px + 72 * (100vw - 320px) / 1120), 200px); padding-bottom:clamp(128px, calc(128px + 72 * (100vw - 320px) / 1120), 200px); padding-left:clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px); padding-right:clamp(32px, calc(32px + 32 * (100vw - 320px) / 1120), 64px);">

  <div style="max-width:680px; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:24px;">

    <h2 id="s19-headline" style="margin:0; font:700 clamp(32px, calc(32px + 20 * (100vw - 320px) / 1120), 52px)/1.1 var(--font-sans); color:var(--role-text-primary); letter-spacing:-0.02em; text-wrap:balance;">
      Build faster with the whole platform behind you
    </h2>

    <p style="margin:0; max-width:560px; font:400 clamp(17px, calc(17px + 3 * (100vw - 320px) / 1120), 20px)/1.5 var(--font-sans); color:var(--role-text-secondary); text-wrap:balance;">
      Start a free workspace in minutes, invite your team, and ship your first project today. No card required, cancel anytime.
    </p>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px; margin-top:8px;">
      <button type="button" class="button-base button-primary">Create a free workspace</button>
      <button type="button" class="button-base button-tertiary">Talk to our team</button>
    </div>

    <form style="width:100%; max-width:520px; margin-top:24px; display:flex; flex-direction:column; align-items:stretch; gap:12px;">
      <div style="display:flex; flex-wrap:wrap; gap:12px;">
        <label for="s19-email" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Email address</label>
        <input id="s19-email" class="standard-text-input" type="email" name="email" placeholder="you@company.com" required autocomplete="email" aria-describedby="s19-status" style="flex:1 1 240px; min-width:0;">
        <button type="submit" class="button-base button-primary" style="flex:0 0 auto;">Subscribe</button>
      </div>
      <p id="s19-status" aria-live="polite" style="margin:0; min-height:1.3em; text-align:left; font:400 13px/1.3 var(--font-sans); color:var(--role-text-tertiary);">
        We send a short product digest about once a month. Unsubscribe anytime.
      </p>
    </form>

  </div>

</section>
