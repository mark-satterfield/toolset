<div class="cds-specimen" data-component="code-block">
  <div class="code">
    <figure class="code-block" data-docs-href="#" style="margin: 0; padding: 16px; max-width: 560px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px;">
        <div style="display: inline-flex; align-items: center; gap: 8px;">
          <label for="code-block-lang" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;">Language</label>
          <select id="code-block-lang" class="standard-text-input" style="height: 32px; padding: 0 8px; border-radius: 8px;">
            <option selected>Shell</option>
            <option>JavaScript</option>
            <option>Python</option>
          </select>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 8px;">
          <button type="button" class="button-tertiary" style="min-height: 32px; padding: 4px 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 1;">
            <span aria-hidden="true">⧉</span> Copy
          </button>
          <a href="#" class="button-tertiary" style="min-height: 32px; padding: 4px 12px; border-radius: 8px; display: inline-flex; align-items: center; text-decoration: none; font-size: 14px; line-height: 1;">View Docs</a>
        </div>
      </div>

      <pre style="margin: 0; overflow-x: auto;"><code style="font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--role-text-primary);"><span style="color: var(--role-text-tertiary);"># install the workspace toolkit</span>
<span style="color: var(--role-accent-primary);">npx</span> create-workspace <span style="color: var(--role-accent-interactive);">--template</span> <span style="color: var(--role-accent-interactive);">"starter"</span>
<span style="color: var(--role-accent-primary);">cd</span> my-workspace
<span style="color: var(--role-accent-primary);">npm</span> run dev</code></pre>

      <span aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;"></span>
    </figure>
  </div>
</div>
