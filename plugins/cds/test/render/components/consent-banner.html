<div class="cds-specimen" data-component="consent-banner">
  <div style="position:relative; min-height:240px; border-radius:16px; overflow:hidden; padding:24px; display:flex; justify-content:flex-end; align-items:flex-end;">

    <section role="region" aria-label="Cookie consent" class="consent-banner" style="max-width:420px; background:var(--role-surface-raised); border:1px solid var(--role-border-subtle); box-shadow:0 12px 32px rgba(0,0,0,0.18);">
      <h2 style="margin:0 0 8px; font:600 18px/1.3 var(--font-sans); color:var(--role-text-primary);">We value your privacy</h2>

      <p class="consent-banner__body" style="margin:0 0 20px; font:400 14px/1.5 var(--font-sans);">
        We use cookies to keep the site running, remember your preferences, and understand how features are used. You can accept all cookies or limit them to what is strictly necessary.
      </p>

      <div style="display:flex; gap:12px;">
        <button type="button" class="button-base button-primary">Accept all</button>
        <button type="button" class="button-base button-secondary">Reject non-essential</button>
      </div>

      <button type="button" class="button-base button-tertiary" style="margin-top:12px; min-height:auto; padding:4px 0; background:transparent; border:0;">Manage preferences</button>
    </section>

  </div>
</div>
