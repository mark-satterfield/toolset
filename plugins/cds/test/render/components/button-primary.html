<div class="cds-specimen" data-component="button-primary">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
    <button type="button" class="button-base button-primary">Create workspace</button>

    <button type="button" class="button-base button-primary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="vertical-align: -2px; margin-right: 6px;"><path d="M8 3.5v9M3.5 8h9" stroke-linecap="round"/></svg>New project
    </button>

    <button type="button" class="button-base button-primary" aria-busy="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke-opacity="0.3"/><path d="M14 8a6 6 0 00-6-6" stroke-linecap="round"/></svg>
    </button>

    <button type="button" class="button-base button-primary" disabled>Create workspace</button>
  </div>
  <p style="margin-top: 12px; font-size: 13px;">
    Rest, with leading icon, loading (<code>aria-busy="true"</code>), and disabled.
    Hover paints a 1px outer shoulder ring in the fill color.
  </p>
</div>
