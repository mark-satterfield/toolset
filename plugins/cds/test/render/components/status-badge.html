<div class="cds-specimen" data-component="status-badge">
  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
    <span class="status-badge ok" style="display: inline-flex; align-items: center; padding: 0.25rem 0.5rem; border-radius: 8px;">operational</span>
    <span class="status-badge warning" style="display: inline-flex; align-items: center; padding: 0.25rem 0.5rem; border-radius: 8px;">needs attention</span>
    <span class="status-badge error" style="display: inline-flex; align-items: center; padding: 0.25rem 0.5rem; border-radius: 8px;">failed</span>
    <span class="status-badge neutral" style="display: inline-flex; align-items: center; padding: 0.25rem 0.5rem; border-radius: 8px;">archived</span>
  </div>
</div>
