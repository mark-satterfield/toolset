<div class="cds-specimen" data-component="kebab-menu">
  <div style="display:flex; align-items:flex-start; gap:64px; flex-wrap:wrap;">

    <!-- trigger: rest (menu closed) -->
    <div style="position:relative;">
      <button type="button" class="kebab-menu__trigger" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <circle cx="10" cy="4" r="1"/>
          <circle cx="10" cy="8" r="1"/>
          <circle cx="10" cy="12" r="1"/>
        </svg>
      </button>
    </div>

    <!-- trigger: open (menu visible) -->
    <div style="position:relative;">
      <button type="button" class="kebab-menu__trigger" aria-label="More actions" aria-haspopup="menu" aria-expanded="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <circle cx="10" cy="4" r="1"/>
          <circle cx="10" cy="8" r="1"/>
          <circle cx="10" cy="12" r="1"/>
        </svg>
      </button>
      <ul class="kebab-menu" role="menu" style="position:absolute; top:36px; right:0; min-width:180px; list-style:none; margin:0; padding:4px; background:var(--role-surface-raised); border:1px solid var(--role-border-subtle); box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:10;">
        <li role="none">
          <button type="button" role="menuitem" class="kebab-menu__item" style="display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent; font:inherit; color:var(--role-text-primary); text-align:left;">View details</button>
        </li>
        <li role="none">
          <button type="button" role="menuitem" class="kebab-menu__item" style="display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent; font:inherit; color:var(--role-text-primary); text-align:left;">Refresh tools list</button>
        </li>
        <li role="none">
          <button type="button" role="menuitem" class="kebab-menu__item kebab-menu__item--destructive" style="display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent; font:inherit; text-align:left;">Remove</button>
        </li>
      </ul>
    </div>

  </div>
</div>
