<div class="cds-specimen clarity" data-component="filter-chip">
  <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; padding:24px;">

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">labelled — rest</figcaption>
      <div class="filter-chip">
        <button type="button" aria-haspopup="dialog" aria-expanded="false" style="display:flex; align-items:center; gap:6px; height:32px; padding:0 0 0 8px; border:0; background:transparent; color:inherit; font:inherit; cursor:pointer;">
          <span><span class="filter-chip__label">Group by</span>&nbsp;Project</span>
          <span aria-hidden="true" style="display:inline-flex;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </button>
      </div>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">labelled — open (caret rotated)</figcaption>
      <div class="filter-chip">
        <button type="button" aria-haspopup="dialog" aria-expanded="true" style="display:flex; align-items:center; gap:6px; height:32px; padding:0 0 0 8px; border:0; background:transparent; color:inherit; font:inherit; cursor:pointer;">
          <span><span class="filter-chip__label">Range</span>&nbsp;Last 30 days</span>
          <span aria-hidden="true" style="display:inline-flex; transform:rotate(180deg);">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </button>
      </div>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">icon-only</figcaption>
      <div class="filter-chip" style="width:32px; justify-content:center; padding:0;">
        <button type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Download" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border:0; background:transparent; color:inherit; cursor:pointer;">
          <span aria-hidden="true" style="display:inline-flex;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.5v7m0 0L5 6.5m3 3 3-3M3 12.5h10" stroke="var(--role-text-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </button>
      </div>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">disabled</figcaption>
      <div class="filter-chip disabled">
        <button type="button" aria-haspopup="dialog" aria-expanded="false" disabled style="display:flex; align-items:center; gap:6px; height:32px; padding:0 0 0 8px; border:0; background:transparent; color:inherit; font:inherit; cursor:default;">
          <span><span class="filter-chip__label">Owner</span>&nbsp;Anyone</span>
          <span aria-hidden="true" style="display:inline-flex;">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </button>
      </div>
    </figure>

  </div>
</div>
