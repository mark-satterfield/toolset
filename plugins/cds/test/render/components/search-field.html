<div class="cds-specimen clarity" data-component="search-field">
  <div style="display:flex; flex-direction:column; gap:24px; padding:24px; max-width:360px;">

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">rest</figcaption>
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex-shrink:0;">
          <circle cx="7" cy="7" r="4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5"></circle>
          <path d="m10.5 10.5 3 3" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input type="search" class="search-field__input" placeholder="Search templates" aria-label="Search templates">
      </div>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">with-value (custom clear)</figcaption>
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex-shrink:0;">
          <circle cx="7" cy="7" r="4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5"></circle>
          <path d="m10.5 10.5 3 3" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input type="search" class="search-field__input" value="onboarding" placeholder="Search templates" aria-label="Search templates" style="-webkit-appearance:none;">
        <button type="button" aria-label="Clear search" style="display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; border:0; background:transparent; color:var(--role-text-tertiary); cursor:pointer; flex-shrink:0;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m3 3 6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
        </button>
      </div>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">disabled</figcaption>
      <div class="search-field disabled">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex-shrink:0;">
          <circle cx="7" cy="7" r="4.5" stroke="var(--role-text-tertiary)" stroke-width="1.5"></circle>
          <path d="m10.5 10.5 3 3" stroke="var(--role-text-tertiary)" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input type="search" class="search-field__input" placeholder="Search templates" aria-label="Search templates" disabled>
      </div>
    </figure>

  </div>
</div>
