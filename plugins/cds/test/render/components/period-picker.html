<div class="cds-specimen" data-component="period-picker">
  <div style="display:flex; flex-wrap:wrap; align-items:center; gap:24px;">

    <!-- state: rest -->
    <div class="period-picker" role="combobox">
      <button type="button" style="display:inline-flex; align-items:center; gap:6px; padding:0 0 0 8px; border:0; background:transparent; font:inherit; color:inherit;" aria-haspopup="dialog" aria-expanded="false">
        <span class="period-picker__label">Range</span>
        <span>Last 30 days</span>
      </button>
    </div>

    <!-- state: open (trigger reflects expanded dialog) -->
    <div class="period-picker" role="combobox">
      <button type="button" style="display:inline-flex; align-items:center; gap:6px; padding:0 0 0 8px; border:0; background:transparent; font:inherit; color:inherit;" aria-haspopup="dialog" aria-expanded="true">
        <span class="period-picker__label">Range</span>
        <span>Custom: Mar 1 – Mar 14</span>
      </button>
    </div>

    <!-- state: disabled -->
    <div class="period-picker disabled" role="combobox">
      <button type="button" style="display:inline-flex; align-items:center; gap:6px; padding:0 0 0 8px; border:0; background:transparent; font:inherit; color:inherit;" aria-haspopup="dialog" aria-expanded="false" aria-disabled="true">
        <span class="period-picker__label">Range</span>
        <span>This month</span>
      </button>
    </div>

  </div>
</div>
