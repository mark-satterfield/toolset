<div class="cds-specimen" data-component="account-row">

  <!-- Variant: full, state = rest -->
  <button type="button" class="account-row" aria-haspopup="menu" aria-expanded="false"
          aria-label="Account menu for Dana Whitfield, Workspace admin"
          style="width:232px; justify-content:space-between; border:0; cursor:pointer;">
    <span style="display:flex; align-items:center; gap:12px; min-width:0; width:100%;">
      <span class="account-row__avatar" aria-hidden="true" style="flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="7" r="3.25" stroke="currentColor" stroke-width="1.25"/>
          <path d="M4 16C4 13.5 6.7 12 10 12C13.3 12 16 13.5 16 16" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
      </span>
      <span style="display:flex; flex-direction:column; align-items:flex-start; min-width:0; overflow:hidden; padding-right:16px; flex:1;">
        <span class="account-row__name" style="width:100%; text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Dana Whitfield</span>
        <span class="account-row__role" style="width:100%; text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Workspace admin</span>
      </span>
      <span class="account-row__caret" aria-hidden="true" style="flex-shrink:0; display:inline-flex; width:16px; height:16px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 10L8 6L12 10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </span>
  </button>

  <!-- Variant: full, state = menu-open -->
  <button type="button" class="account-row" data-state="open" aria-haspopup="menu" aria-expanded="true"
          aria-label="Account menu for Priya Raman, Billing owner"
          style="width:232px; justify-content:space-between; border:0; cursor:pointer; background:var(--role-surface-tertiary);">
    <span style="display:flex; align-items:center; gap:12px; min-width:0; width:100%;">
      <span class="account-row__avatar" aria-hidden="true" style="flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:500;">PR</span>
      <span style="display:flex; flex-direction:column; align-items:flex-start; min-width:0; overflow:hidden; padding-right:16px; flex:1;">
        <span class="account-row__name" style="width:100%; text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Priya Raman</span>
        <span class="account-row__role" style="width:100%; text-align:start; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Billing owner</span>
      </span>
      <span class="account-row__caret" aria-hidden="true" style="flex-shrink:0; display:inline-flex; width:16px; height:16px; transform:rotate(180deg);">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 10L8 6L12 10" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </span>
  </button>

  <!-- Variant: compact (avatar-only, mini-rail) -->
  <button type="button" class="account-row" aria-haspopup="menu" aria-expanded="false"
          aria-label="Account menu for Dana Whitfield, Workspace admin"
          style="width:32px; height:32px; padding:0; border:0; justify-content:center; cursor:pointer;">
    <span class="account-row__avatar" aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="7" r="3.25" stroke="currentColor" stroke-width="1.25"/>
        <path d="M4 16C4 13.5 6.7 12 10 12C13.3 12 16 13.5 16 16" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
    </span>
  </button>

  <!-- Variant: footer-strip (form sidebar bottom) -->
  <div class="account-row" style="width:280px; height:40px; justify-content:space-between; padding:0 8px;">
    <span style="display:flex; align-items:center; gap:8px; min-width:0;">
      <span class="account-row__avatar" aria-hidden="true" style="width:20px; height:20px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:500;">DW</span>
      <span class="account-row__name" style="font-size:12px; color:var(--role-text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Dana Whitfield</span>
    </span>
    <a class="button-tertiary" href="#" style="font-size:12px; padding:4px 8px; border:0; text-decoration:none;">Sign out</a>
  </div>

</div>
