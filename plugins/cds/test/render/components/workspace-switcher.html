<div class="cds-specimen" data-component="workspace-switcher">

  <!-- Variant: full, state = closed -->
  <div class="workspace-switcher" style="outline-offset:2px;">
    <button type="button" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-label="Switch workspace"
            style="display:flex; flex:1; align-self:stretch; min-width:0; align-items:center; gap:4px; padding:0 0 0 8px; background:transparent; border:0; text-align:left; cursor:pointer;">
      <span aria-hidden="true" style="flex-shrink:0; width:8px; height:8px; border-radius:9999px; background:var(--role-accent-primary);"></span>
      <span class="workspace-switcher__name" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Northwind Operations</span>
      <span class="workspace-switcher__caret" aria-hidden="true" style="flex-shrink:0; margin-right:3px; width:12px; height:12px; display:inline-flex;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </div>

  <!-- Variant: full, state = open (with panel dialog) -->
  <div style="position:relative; width:232px;">
    <div class="workspace-switcher" style="outline-offset:2px;">
      <button type="button" role="combobox" aria-haspopup="dialog" aria-expanded="true" aria-label="Switch workspace"
              style="display:flex; flex:1; align-self:stretch; min-width:0; align-items:center; gap:4px; padding:0 0 0 8px; background:transparent; border:0; text-align:left; cursor:pointer;">
        <span aria-hidden="true" style="flex-shrink:0; width:8px; height:8px; border-radius:9999px; background:var(--role-accent-primary);"></span>
        <span class="workspace-switcher__name" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Northwind Operations</span>
        <span class="workspace-switcher__caret" aria-hidden="true" style="flex-shrink:0; margin-right:3px; width:12px; height:12px; display:inline-flex;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
    <div class="dropdown-panel" role="dialog" aria-label="Workspaces"
         style="position:absolute; top:calc(100% + 6px); left:0; width:248px; padding:6px; background:var(--role-surface-raised); border:1px solid var(--role-border-subtle); border-radius:8px;">
      <a class="app-shell-left-rail__item-row active" aria-current="true" href="#"
         style="display:flex; align-items:center; gap:8px; text-decoration:none;">
        <span aria-hidden="true" style="flex-shrink:0; width:8px; height:8px; border-radius:9999px; background:var(--role-accent-primary);"></span>
        Northwind Operations
      </a>
      <a class="app-shell-left-rail__item-row" href="#"
         style="display:flex; align-items:center; gap:8px; text-decoration:none;">
        <span aria-hidden="true" style="flex-shrink:0; width:8px; height:8px; border-radius:9999px; background:var(--role-status-positive-bg);"></span>
        Field Logistics
      </a>
      <a class="app-shell-left-rail__item-row" href="#"
         style="display:flex; align-items:center; gap:8px; text-decoration:none;">
        <span aria-hidden="true" style="flex-shrink:0; width:8px; height:8px; border-radius:9999px; background:var(--role-status-caution-bg);"></span>
        Partner Sandbox
      </a>
      <button type="button" class="button-base button-tertiary"
              style="display:flex; align-items:center; gap:8px; width:100%; margin-top:4px; text-align:left;">
        <span aria-hidden="true" style="display:inline-flex; width:16px; height:16px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.5V12.5M3.5 8H12.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
        </span>
        Create workspace
      </button>
    </div>
  </div>

  <!-- Variant: compact (icon-only, rail collapsed) -->
  <button type="button" class="workspace-switcher compact" aria-label="Open workspace switcher" aria-haspopup="dialog" aria-expanded="false"
          style="display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--role-border-subtle); cursor:pointer;">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="2.5" y="2.5" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.25"/>
      <path d="M2.5 6.5H13.5" stroke="currentColor" stroke-width="1.25"/>
    </svg>
  </button>

</div>
