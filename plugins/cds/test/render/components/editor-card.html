<div class="cds-specimen" data-component="editor-card">
  <div style="display:flex; flex-direction:column; gap:20px; max-width:640px;">

    <!-- role: system — state: rest -->
    <div style="position:relative;">
      <label for="editor-card-system" class="editor-card__badge">System Prompt</label>
      <div class="editor-card" style="position:relative; width:100%;">
        <div id="editor-card-system" class="editor-card__content" role="textbox" contenteditable="true" aria-multiline="true" style="flex:1; min-width:0; outline:none;">You are a concise assistant. Answer in plain language and cite sources when asked.</div>
        <button type="button" class="kebab-menu__trigger" aria-label="Delete turn" style="position:absolute; right:4px; top:4px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 4.5h9M6.5 4.5V3.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1M5 4.5l.5 7a1 1 0 0 0 1 .9h3a1 1 0 0 0 1-.9l.5-7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- role: user — state: focus (content has focus; border shifts to accent) -->
    <div style="position:relative;">
      <label for="editor-card-user" class="editor-card__badge">User</label>
      <div class="editor-card focus" style="position:relative; width:100%;">
        <div id="editor-card-user" class="editor-card__content" role="textbox" contenteditable="true" aria-multiline="true" style="flex:1; min-width:0; outline:none;">Summarize the quarterly report and flag any figures that fell below target.</div>
      </div>
    </div>

    <!-- role: assistant — state: empty (placeholder shown) -->
    <div style="position:relative;">
      <label for="editor-card-assistant" class="editor-card__badge">Assistant</label>
      <div class="editor-card" style="position:relative; width:100%;">
        <div id="editor-card-assistant" class="editor-card__content" role="textbox" contenteditable="true" aria-multiline="true" aria-placeholder="Write the assistant turn…" style="flex:1; min-width:0; outline:none; color:var(--role-text-tertiary);">Write the assistant turn…</div>
      </div>
    </div>

    <!-- role: user — state: disabled -->
    <div style="position:relative;">
      <label for="editor-card-disabled" class="editor-card__badge">User</label>
      <div class="editor-card disabled" style="position:relative; width:100%;">
        <div id="editor-card-disabled" class="editor-card__content" role="textbox" contenteditable="false" aria-disabled="true" aria-multiline="true" style="flex:1; min-width:0; outline:none;">This turn is locked while the run is in progress.</div>
      </div>
    </div>

  </div>
</div>
