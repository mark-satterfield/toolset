<div class="cds-specimen clarity" data-component="switch-active">
  <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:32px; padding:24px;">

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">Off</figcaption>
      <button type="button" role="switch" aria-checked="false" aria-label="Email notifications" class="switch-active" style="display:inline-flex; padding:0; border:0; background:transparent; cursor:pointer;">
        <span class="switch-active__track" style="position:relative; display:inline-block; width:36px; height:20px; border-radius:999px;">
          <span class="switch-active__thumb" style="position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; transform:translateX(0);"></span>
        </span>
      </button>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">On (active)</figcaption>
      <button type="button" role="switch" aria-checked="true" aria-label="Email notifications" class="switch-active" style="display:inline-flex; padding:0; border:0; background:transparent; cursor:pointer;">
        <span class="switch-active__track on" style="position:relative; display:inline-block; width:36px; height:20px; border-radius:999px;">
          <span class="switch-active__thumb" style="position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; transform:translateX(16px);"></span>
        </span>
      </button>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">Disabled (on)</figcaption>
      <button type="button" role="switch" aria-checked="true" aria-label="Email notifications" class="switch-active" disabled style="display:inline-flex; padding:0; border:0; background:transparent; opacity:0.5; cursor:not-allowed; pointer-events:none;">
        <span class="switch-active__track on" style="position:relative; display:inline-block; width:36px; height:20px; border-radius:999px;">
          <span class="switch-active__thumb" style="position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; transform:translateX(16px);"></span>
        </span>
      </button>
    </figure>

  </div>
</div>
