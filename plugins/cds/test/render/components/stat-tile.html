<div class="cds-specimen clarity" data-component="stat-tile">
  <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; padding:24px;">

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">large-horizontal — populated (KPI)</figcaption>
      <article class="stat-tile large-horizontal" style="width:254px; height:176px; box-sizing:border-box; justify-content:space-between;">
        <span style="display:flex; flex-direction:column; gap:4px;">
          <span style="font:400 13px/1.2 var(--font-sans); color:var(--role-text-tertiary);">Monthly active seats</span>
          <span style="font:700 36px/1 var(--font-sans); color:var(--role-text-primary);">4,812</span>
        </span>
        <span aria-hidden="true" style="display:inline-flex;">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <circle cx="28" cy="28" r="22" stroke="var(--role-border-subtle)" stroke-width="6"></circle>
            <circle cx="28" cy="28" r="22" stroke="var(--role-accent-primary)" stroke-width="6" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="40" transform="rotate(-90 28 28)"></circle>
          </svg>
        </span>
      </article>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">small-vertical — populated (sparkline)</figcaption>
      <article class="stat-tile small-vertical" style="width:210px; height:144px; box-sizing:border-box; justify-content:center;">
        <span style="font:400 13px/1.2 var(--font-sans); color:var(--role-text-tertiary);">Requests / min</span>
        <span aria-hidden="true" style="display:block;">
          <svg width="178" height="40" viewBox="0 0 178 40" fill="none" preserveAspectRatio="none">
            <polyline points="0,30 26,24 52,28 78,14 104,18 130,8 156,12 178,4" stroke="var(--role-accent-primary)" stroke-width="2" fill="none"></polyline>
          </svg>
        </span>
        <span style="font:400 12px/1.3 var(--font-sans); color:var(--role-text-tertiary);">Up 18% vs. last hour</span>
      </article>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">small-vertical — empty (no data)</figcaption>
      <article class="stat-tile small-vertical" style="width:210px; height:144px; box-sizing:border-box; justify-content:center;">
        <span style="font:400 13px/1.2 var(--font-sans); color:var(--role-text-tertiary);">Error rate</span>
        <span aria-hidden="true" style="display:block;">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="16" stroke="var(--role-text-tertiary)" stroke-width="3" stroke-dasharray="4 5"></circle>
          </svg>
        </span>
        <span style="font:400 12px/1.3 var(--font-sans); color:var(--role-text-tertiary);">No data yet</span>
      </article>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">small-vertical — setup-required (status pill + action)</figcaption>
      <article class="stat-tile small-vertical" style="width:210px; height:144px; box-sizing:border-box; justify-content:center;">
        <span style="font:400 13px/1.2 var(--font-sans); color:var(--role-text-tertiary);">Usage alerts</span>
        <span aria-hidden="true" style="display:inline-flex;">
          <span class="status-badge neutral" style="padding:4px 8px; border-radius:6px;">not enabled</span>
        </span>
        <button type="button" class="button-tertiary" style="align-self:flex-start; min-height:32px; padding:6px 12px; border:1px solid var(--role-button-tertiary-border); border-radius:8px; background:transparent; color:var(--role-text-tertiary); font:400 13px/1 var(--font-sans); cursor:pointer;">Set up</button>
      </article>
    </figure>

  </div>
</div>
