<div class="cds-specimen clarity" data-component="auth-primary-cta">
  <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:24px; padding:24px;">

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">Rest</figcaption>
      <button type="button" class="auth-primary-cta">
        <span style="position:relative; font:480 15px/1 var(--font-sans); color:var(--role-button-primary-text);">Create account</span>
      </button>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">Hover (bloom)</figcaption>
      <button type="button" class="auth-primary-cta" style="transform:scale(1.005,1.015);">
        <span class="auth-primary-cta__bloom" style="position:absolute; inset:0; border-radius:9.6px; opacity:1; background:radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--role-accent-primary) 40%, transparent) 0%, transparent 70%);"></span>
        <span style="position:relative; font:480 15px/1 var(--font-sans); color:var(--role-button-primary-text);">Create account</span>
      </button>
    </figure>

    <figure style="margin:0; display:flex; flex-direction:column; gap:8px;">
      <figcaption style="font:400 12px/1.4 var(--font-sans); color:var(--role-text-tertiary);">Disabled</figcaption>
      <button type="button" class="auth-primary-cta" disabled>
        <span style="position:relative; font:480 15px/1 var(--font-sans); color:var(--role-button-primary-text);">Create account</span>
      </button>
    </figure>

  </div>
</div>
