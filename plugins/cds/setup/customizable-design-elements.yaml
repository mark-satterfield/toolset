    description: "Saturated ground 3."
    required: true
  tile-ink-3:
    type: color
    scope: semantic
    family: ground
    from_palette: text
    description: "Ink paired with ground 3."
    required: true

  tile-ground-accent:
    type: color
    scope: semantic
    family: ground
    from_palette: accent
    description: "Accent ground."
    required: true
  tile-ink-accent:
    type: color
    scope: semantic
    family: ground
    from_palette: text
    description: "Ink paired with the accent ground."
    required: true

  # ----- BADGE component (status pills) --------------------
