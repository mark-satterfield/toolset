    family: status
    from_palette: status
    description: "Error/failed badge ground."
    required: true

# ============================================================
# THEMES
# Named binding sets.  Each theme provides values for roles.
# A theme is consumed by wrapping a DOM subtree with the
# corresponding class (e.g., <section class="default">).
# Class names are bare role-based identifiers; no methodology
# prefix.  An alias theme (e.g. `editorial`) names a concrete
# theme via `alias:`; the generator emits it sharing 100% of
# the target's rules in every mode (see `editorial` below).
# ------------------------------------------------------------
# MODE COVERAGE: every theme binds every role.  A theme that
# changes appearance on the light/dark flip declares BOTH a
# `light` and a `dark` mode, each listing all roles.  A theme
# that does NOT change between modes declares only its active
# (`light`) mode; the redundant mode is retained directly
# below it as a fully commented-out template.  Uncomment that
# block and edit it to make the theme diverge in that mode.
# An absent (commented) mode means "identical to the active
# mode."
# ============================================================
themes:

  # ------------------------------------------------------------
  # clarity — High-clarity light theme.  Pure-white ground.
  # ------------------------------------------------------------
  clarity:
    description: "High-clarity light theme. Pure-white ground for pricing, card-heavy interior sections, dense content."
    modes:
      light:
        bindings:
          surface-primary:       { var: "--color-backgrounds-ivory" }
          surface-secondary:     { var: "--color-backgrounds-pure" }
          surface-tertiary:      { var: "--color-backgrounds-linen" }
          surface-raised:        { var: "--color-backgrounds-pure" }
          surface-muted:         { var: "--color-backgrounds-linen" }
          text-primary:          { var: "--color-text-ink" }
          text-secondary:        { var: "--color-text-graphite" }
          text-tertiary:         { var: "--color-text-dim" }
          text-inverse:          { var: "--color-text-frost" }
          border-subtle:         { var: "--color-borders-tan" }
          border-strong:         { var: "--color-borders-charcoal" }
          accent-primary:        { var: "--color-accent-primary" }
          accent-interactive:    { var: "--color-accent-interactive" }
          accent-heroes:         { var: "--color-accent-primary" }
          focus-ring:            { var: "--color-borders-gray" }
          button-primary-bg:     { var: "--color-buttons-primary-bg-brand" }
          button-primary-text:   { var: "--color-buttons-primary-txt-frost" }
          button-secondary-bg:   { var: "--color-buttons-secondary-bg-pale" }
          button-secondary-text: { var: "--color-buttons-secondary-txt-slate" }
          button-tertiary-border: { var: "--color-buttons-tertiary-border" }
          switch-active-bg:      { var: "--color-signals-focus" }
          # --- uniform role coverage (every theme binds every role) ---
          selection-bg:          { var: "--color-accent-primary" }
          input-focus-ring:      { var: "--color-signals-focus" }
          nav-bg:                { var: "--color-backgrounds-ivory" }
          nav-text:              { var: "--color-text-ink" }
          footer-bg:             { var: "--color-backgrounds-brand-navy" }
          footer-text:           { var: "--color-text-powder" }
          hero-bg:               { var: "--color-backgrounds-pure" }
          hero-text:             { var: "--color-text-ink" }
          error-text:            { var: "--color-signals-error-text-dark" }
          error-fill:            { var: "--color-signals-error" }
          field-required:        { var: "--color-signals-required" }
          tile-ground-1:         { var: "--color-panels-a" }
          tile-ink-1:            { var: "--color-text-ink" }
          tile-ground-2:         { var: "--color-panels-g" }
          tile-ink-2:            { var: "--color-text-ink" }
          tile-ground-3:         { var: "--color-panels-d" }
          tile-ink-3:            { var: "--color-text-ivory" }
          tile-ground-accent:    { var: "--color-accent-primary" }
          tile-ink-accent:       { var: "--color-text-ivory" }
          status-positive-bg:    { var: "--color-status-positive" }
          status-caution-bg:     { var: "--color-status-caution" }
          status-critical-bg:    { var: "--color-status-critical" }
      dark:
