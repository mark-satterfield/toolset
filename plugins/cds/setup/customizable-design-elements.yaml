    family: button
    from_palette: buttons
    description: "Secondary-action button label color."
    required: true

  # ----- BUTTON — TERTIARY component -----------------------
  button-tertiary-border:
    type: color
    scope: component
    component: button-tertiary
    family: button
    from_palette: buttons
    description: "Outline-only tertiary action border."
    required: true

  # ----- SWITCH component ---------------------------------
  switch-active-bg:
    type: color
    scope: component
    component: switch
    from_palette: signals
    description: "Toggle-switch ON-state fill. Chromatic blue, identical across every theme."
    required: true

  # ----- ERROR roles --------------------------------------
  error-text:
    type: color
    scope: semantic
    family: state
    from_palette: signals
    description: "Inline error message ink."
    required: true

  error-fill:
    type: color
    scope: semantic
    family: state
    from_palette: signals
    description: "Destructive-action button background."
    required: true

  field-required:
    type: color
    scope: semantic
    family: state
    from_palette: signals
    description: "Required-field asterisk ink."
    required: true

  # ----- GROUND roles (shared, data-driven) ----------------
  # Saturated grounds. The generator emits one `.feature-tile--N`
  # and one `.ground--N` per `tile-ground-N` role declared here, so
  # the variant set follows the data. Variety is positional
  # (1/2/3 + accent), never color-named: declare more
  # `tile-ground-N` / `tile-ink-N` pairs to add grounds.
  tile-ground-1:
    type: color
    scope: semantic
    family: ground
    from_palette: panels
    description: "Saturated ground 1."
    required: true
  tile-ink-1:
    type: color
    scope: semantic
    family: ground
    from_palette: text
    description: "Ink paired with ground 1."
    required: true

  tile-ground-2:
