# ============================================================
# Customizable Design System — customizable elements
# Validates against: ./customizable-design-elements.schema.json
# ============================================================

# yaml-language-server: $schema=./customizable-design-elements.schema.json

$schema_version: "1.0.0"

# ------------------------------------------------------------
# Conventions
# How a code generator turns paths in this file into CSS
# variable names.  Single source of truth for naming.
# ------------------------------------------------------------
$conventions:
  color_var_pattern:    "--color-{palette key}-{color key}"
  typeface_var_pattern: "--typeface-{typeface key}"
  font_var_pattern:     "--font-{font key}"
  role_var_pattern:     "--role-{role key}"

# ============================================================
# COLOR CATALOG
# All raw color values plus aliases.  Roles and themes
# reference values from here via aliases of make use of Func { var: "--color-..." }.
# ============================================================
color_catalog:

  common_colors:
    type: Discrete
    description: "Foundational colors not part of any single ramp."
    colors:
      white:
        name: "Pure White"
        hex: "#FFFFFF"
      black:
        name: "Absolute Black"
        hex: "#000000"

  palettes:

    # ------------------------------------------------------------
    # NEUTRAL RAMP
    # ------------------------------------------------------------
    neutral:
      type: Ramp
      description: "Warm-toned neutral ramp."
      colors:
        "000": { name: "Pure white",      hex: "#FFFFFF" }
        "050": { name: "Bone ivory",      hex: "#FAF9F5" }
        "100": { name: "Ivory secondary", hex: "#F5F4ED" }
        "150": { name: "Cream",           hex: "#F0EEE6" }
        "200": { name: "Pale beige",      hex: "#E8E6DC" }
        "250": { name: "Beige tier",      hex: "#DEDCD1" }
        "300": { name: "Soft tan",        hex: "#D1CFC5" }
        "350": { name: "Mid tan",         hex: "#C2C0B6" }
        "400": { name: "Warm gray",       hex: "#B0AEA5" }
        "450": { name: "Warm-mid gray",   hex: "#9C9A92" }
        "500": { name: "Mid gray",        hex: "#87867F" }
        "550": { name: "Dim gray",        hex: "#73726C" }
        "600": { name: "Dim warm gray",   hex: "#5E5D59" }
        "650": { name: "Deep gray",       hex: "#4D4C48" }
        "700": { name: "Charcoal",        hex: "#3D3D3A" }
        "750": { name: "Deep charcoal",   hex: "#30302E" }
        "800": { name: "Dark warm",       hex: "#262624" }
        "850": { name: "Deeper warm",     hex: "#1F1E1D" }
        "900": { name: "Near-deep",       hex: "#1A1918" }
        "950": { name: "Near-black",      hex: "#141413" }
        "1000": { name: "Absolute black", hex: "#000000" }

    # ------------------------------------------------------------
    # BLUE RAMP
    # ------------------------------------------------------------
    blue:
      type: Ramp
      description: "Cool blue ramp."
      colors:
        "000": { name: "Pure white",      hex: "#FFFFFF" }
        "050": { name: "Cloud",           hex: "#F8F9FC" }
        "100": { name: "Frost blue",      hex: "#F1F4F9" }
        "150": { name: "Pale sky",        hex: "#EAEEF5" }
        "200": { name: "Light periwinkle", hex: "#E0E6F1" }
        "250": { name: "Lavender mist",   hex: "#D4DCEB" }
        "300": { name: "Pale denim",      hex: "#C4CFE4" }
        "350": { name: "Soft blue",       hex: "#B2C1DB" }
        "400": { name: "Powder blue",     hex: "#9CAFD0" }
        "450": { name: "Cool blue",       hex: "#6A9BCC" }
        "500": { name: "Cornflower",      hex: "#6B86B6" }
        "550": { name: "Slate blue",      hex: "#5371A9" }
        "600": { name: "Royal indigo",    hex: "#3D5C95" }
        "650": { name: "Deep slate",      hex: "#3D4A6B" }
        "700": { name: "Navy",            hex: "#2B3A6B" }
        "750": { name: "Midnight navy",   hex: "#1D2F50" }
        "800": { name: "Deep navy",       hex: "#162541" }
        "850": { name: "Near-midnight",   hex: "#111E35" }
        "900": { name: "Midnight",        hex: "#0D192E" }
        "950": { name: "Inkwell",         hex: "#0A1426" }
        "1000": { name: "Absolute black", hex: "#000000" }

    # ------------------------------------------------------------
    # GREEN RAMP
    # ------------------------------------------------------------
    green:
      type: Ramp
      description: "Cool green ramp."
      colors:
        "000": { hex: "#FFFFFF" }
        "050": { name: "Frost",        hex: "#F7FAF9" }
        "100": { name: "Pale mint",    hex: "#F1F5F3" }
        "150": { name: "Mist green",   hex: "#E9F0ED" }
        "200": { name: "Pale sage",    hex: "#DFE8E5" }
        "250": { name: "Soft sage",    hex: "#D2DFDB" }
        "300": { name: "Cactus",       hex: "#BCD1CA" }
        "350": { name: "Sage",         hex: "#AFC6BE" }
        "400": { name: "Soft moss",    hex: "#98B6AC" }
        "450": { name: "Moss",         hex: "#7FA397" }
        "500": { name: "Cool green",   hex: "#629987" }
        "550": { name: "Forest",       hex: "#497E6E" }
        "600": { name: "Deep forest",  hex: "#2F6959" }
        "650": { name: "Pine",         hex: "#255649" }
        "700": { name: "Dark pine",    hex: "#1D453A" }
        "750": { name: "Spruce",       hex: "#15372E" }
        "800": { name: "Deep spruce",  hex: "#102C24" }
        "850": { name: "Evergreen",    hex: "#0B231D" }
        "900": { name: "Near-evergreen", hex: "#081E18" }
        "950": { name: "Near-black green", hex: "#061813" }
        "1000": { hex: "#000000" }

    # ------------------------------------------------------------
    # RED RAMP
    # ------------------------------------------------------------
    red:
      type: Ramp
      description: "Warm red/rose ramp."
      colors:
        "000": { hex: "#FFFFFF" }
        "050": { name: "Pale blush",      hex: "#FCF8F9" }
        "100": { name: "Blush",           hex: "#F9F2F3" }
        "150": { name: "Soft pink",       hex: "#F5EBED" }
        "200": { name: "Pale rose",       hex: "#F0E1E4" }
        "250": { name: "Rose mist",       hex: "#EAD6DA" }
        "300": { name: "Pale dusty rose", hex: "#E2C7CC" }
        "350": { name: "Dusty rose",      hex: "#D9B5BC" }
        "400": { name: "Soft rose",       hex: "#CDA0AA" }
        "450": { name: "Mauve",           hex: "#BF8895" }
        "500": { name: "Dusty mauve",     hex: "#B17080" }
        "550": { name: "Wine rose",       hex: "#A1586B" }
        "600": { name: "Wine",            hex: "#8C4156" }
        "650": { name: "Deep wine",       hex: "#743446" }
        "700": { name: "Crimson",         hex: "#6B1F2A" }
        "750": { name: "Burgundy",        hex: "#5A1F3D" }
        "800": { name: "Deep burgundy",   hex: "#3D1823" }
        "850": { name: "Near-black wine", hex: "#32121B" }
        "900": { name: "Inky burgundy",   hex: "#2B0F17" }
        "950": { name: "Near-black red",  hex: "#230B12" }
        "1000": { hex: "#000000" }


    # ------------------------------------------------------------
    # ACCENT
    # ------------------------------------------------------------
    accent:
      type: Discrete
      description: "Burnt-orange chromatic accent family."
      colors:
        primary:     { name: "Saturated burnt orange", hex: "#F46C5D" }
        interactive: { name: "Darker burnt orange",    hex: "#E35849" }
        hover:       { name: "Hover burnt orange",     hex: "#E05446" }
        dark:        { name: "Dark-mode burnt orange", hex: "#DE5D4E" }

    # ------------------------------------------------------------
    # PANEL
    # ------------------------------------------------------------
    panel:
      type: Discrete
      description: "Saturated discrete tile colors."
      colors:
        oat:      { name: "Warm tan",      hex: "#E3DACC" }
        peach:    { name: "Pale peach",    hex: "#EBC9B7" }
        coral:    { name: "Pink coral",    hex: "#EBCECE" }
        fig:      { name: "Saturated pink", hex: "#C46686" }
        olive:    { name: "Earthy green",  hex: "#788C5D" }
        mineral:  { name: "Cool green",    hex: "#629987" }
        cactus:   { name: "Pale sage",     hex: "#BCD1CA" }
        sky:      { name: "Cool blue",     hex: "#6A9BCC" }
        heather:  { name: "Pale violet",   hex: "#CBCADB" }
        plum:     { name: "Cool violet",   hex: "#827DBD" }

    # ------------------------------------------------------------
    # STATE
    # ------------------------------------------------------------
    state:
      type: Discrete
      description: "Semantic state colors."
      colors:
        error-light: { name: "Muted red",      hex: "#B53333" }
        error-dark:  { name: "Light red",      hex: "#DF6666" }
        error-fill:  { name: "Deep red",       hex: "#BF4D43" }
        required:    { name: "Dark crimson",   hex: "#8A2424" }
        focus-blue:  { name: "Chromatic blue", hex: "#2C84DB" }




# ============================================================
# TYPEFACES
# ============================================================
typefaces:

  host-grotesk:
    name: "Host Grotesk"
    type: variable
    weights: { min: 300, max: 900 }
    italic: true

  literata:
    name: "Literata"
    type: variable
    weights:      { min: 300, max: 900 }
    optical_size: { min: 7,   max: 72  }
    italic: true

  red-hat-mono:
    name: "Red Hat Mono"
    type: variable
    weights: { min: 300, max: 700 }
    italic: false

# ============================================================
# FONTS
# ============================================================
fonts:

  sans:
    typeface: { var: "--typeface-host-grotesk" }
    fallback: "system-ui, sans-serif"

  serif:
    typeface: { var: "--typeface-literata" }
    fallback: "Georgia, serif"

  mono:
    typeface: { var: "--typeface-red-hat-mono" }
    fallback: "ui-monospace, monospace"

# ============================================================
# ROLES
# Semantic and component role definitions.
# Each role is a named placeholder filled by a theme.
# ============================================================
roles:

  # ----- SURFACE family --------------------------------------
  surface-primary:
    type: color
    scope: semantic
    family: surface
    description: "Section ground. Default background of any section that doesn't override."
    required: true
    constraints:
      - "AAA contrast against text-primary on every theme."

  surface-secondary:
    type: color
    scope: semantic
    family: surface
    description: "Inset blocks, secondary panel grounds within the section."
    required: true

  surface-tertiary:
    type: color
    scope: semantic
    family: surface
    description: "Pill-tab strip ground, deepest stratification within the theme."
    required: true

  surface-raised:
    type: color
    scope: semantic
    family: surface
    description: "Card fills that sit slightly above the page ground."
    required: true

  surface-muted:
    type: color
    scope: semantic
    family: surface
    description: "Disabled inputs, dimmed states."
    required: true

  # ----- TEXT family ----------------------------------------
  text-primary:
    type: color
    scope: semantic
    family: text
    description: "Default body and heading ink."
    required: true
    constraints:
      - "AAA contrast against surface-primary."

  text-secondary:
    type: color
    scope: semantic
    family: text
    description: "Lead-in paragraphs, sub-headings."
    required: true

  text-tertiary:
    type: color
    scope: semantic
    family: text
    description: "Meta, captions, dates, placeholder text."
    required: true
    constraints:
      - "AA contrast against surface-primary."

  text-inverse:
    type: color
    scope: semantic
    family: text
    description: "Text that paints against the inverse of the page ground (used on primary buttons)."
    required: true

  # ----- BORDER family -------------------------------------
  border-subtle:
    type: color
    scope: semantic
    family: border
    description: "Hairlines, default form-field rest border, card outlines."
    required: true

  border-strong:
    type: color
    scope: semantic
    family: border
    description: "Active borders, divider rules between metadata and body."
    required: true

  # ----- ACCENT family -------------------------------------
  accent-primary:
    type: color
    scope: semantic
    family: accent
    description: "Mascot, decorative glyphs, highlight rules."
    required: true

  accent-interactive:
    type: color
    scope: semantic
    family: accent
    description: "Brand-button rest-state fill."
    required: true

  accent-heroes:
    type: color
    scope: semantic
    family: accent
    description: "Foreground color for theme-bound decorative artwork (mascot, hero SVGs)."
    required: true

  # ----- SELECTION + FOCUS ---------------------------------
  selection-bg:
    type: color
    scope: semantic
    description: "Text-selection background tint. Global; derived from the accent family (50% mix)."
    required: false
    fallback:
      color-mix: "(in srgb, var(--color-accent-primary) 50%, transparent)"

  focus-ring:
    type: color
    scope: semantic
    description: "Keyboard focus outline color."
    required: true

  # ----- NAV component -------------------------------------
  nav-bg:
    type: color
    scope: component
    component: topbar
    family: nav
    description: "Topbar background."
    required: false

  nav-text:
    type: color
    scope: component
    component: topbar
    family: nav
    description: "Topbar foreground."
    required: false

  # ----- FOOTER component ----------------------------------
  footer-bg:
    type: color
    scope: component
    component: footer
    family: footer
    description: "Footer background. Brand-dark ground (matches primary button)."
    required: false

  footer-text:
    type: color
    scope: component
    component: footer
    family: footer
    description: "Footer foreground body text."
    required: false

  # ----- HERO component ------------------------------------
  hero-bg:
    type: color
    scope: component
    component: hero
    family: hero
    description: "Hero section background within the active theme."
    required: false

  hero-text:
    type: color
    scope: component
    component: hero
    family: hero
    description: "Hero foreground within the active theme."
    required: false

  # ----- BUTTON — PRIMARY component ------------------------
  button-primary-bg:
    type: color
    scope: component
    component: button-primary
    family: button
    description: "Primary-action button fill (rest state). Inverts with mode."
    required: true

  button-primary-text:
    type: color
    scope: component
    component: button-primary
    family: button
    description: "Primary-action button label color."
    required: true

  # ----- BUTTON — SECONDARY component ----------------------
  button-secondary-bg:
    type: color
    scope: component
    component: button-secondary
    family: button
    description: "Secondary-action button fill (rest state)."
    required: true

  button-secondary-text:
    type: color
    scope: component
    component: button-secondary
    family: button
    description: "Secondary-action button label color."
    required: true

  # ----- BUTTON — TERTIARY component -----------------------
  button-tertiary-border:
    type: color
    scope: component
    component: button-tertiary
    family: button
    description: "Outline-only tertiary action border."
    required: true

  # ----- SWITCH component ---------------------------------
  switch-active-bg:
    type: color
    scope: component
    component: switch
    description: "Toggle-switch ON-state fill. Chromatic blue, identical across every theme."
    required: false

  # ----- ERROR roles --------------------------------------
  error-text:
    type: color
    scope: semantic
    family: state
    description: "Inline error message ink."
    required: false

  error-fill:
    type: color
    scope: semantic
    family: state
    description: "Destructive-action button background."
    required: false

# ============================================================
# THEMES
# Named binding sets.  Each theme provides values for roles.
# A theme is consumed by wrapping a DOM subtree with the
# corresponding class (e.g., <section class="default">).
# Class names are bare role-based identifiers; no methodology
# prefix.  `editorial` is a CSS-level alias of `default`
# (handled in the .css generator, not in this YAML).
# ------------------------------------------------------------
# ARCHITECTURE A: every theme defines both `light` and `dark`
# mode bindings.  Themes that don't visually change with the
# mode flip still declare identical bindings under both modes
# so the data shape is uniform across the system.
# ============================================================
themes:

  # ------------------------------------------------------------
  # clarity — High-clarity light theme.  Pure-white ground.
  # ------------------------------------------------------------
  clarity:
    description: "High-clarity light theme. Pure-white ground for pricing, card-heavy interior sections, dense content."
    modes:
      light:
        bindings:
          surface-primary:       { var: "--color-neutral-000" }
          surface-secondary:     { var: "--color-neutral-050" }
          surface-tertiary:      { var: "--color-neutral-100" }
          surface-raised:        { var: "--color-neutral-000" }
          surface-muted:         { var: "--color-neutral-100" }
          text-primary:          { var: "--color-neutral-950" }
          text-secondary:        { var: "--color-neutral-750" }
          text-tertiary:         { var: "--color-neutral-600" }
          text-inverse:          { var: "--color-blue-050" }
          border-subtle:         { var: "--color-neutral-350" }
          border-strong:         { var: "--color-neutral-700" }
          accent-primary:        { var: "--color-accent-primary" }
          accent-interactive:    { var: "--color-accent-interactive" }
          accent-heroes:         { var: "--color-accent-primary" }
          focus-ring:            { var: "--color-neutral-450" }
          button-primary-bg:     { var: "--color-blue-750" }
          button-primary-text:   { var: "--color-blue-050" }
          button-secondary-bg:   { var: "--color-blue-150" }
          button-secondary-text: { var: "--color-blue-650" }
          button-tertiary-border: { var: "--color-neutral-400" }
          switch-active-bg:      { var: "--color-state-focus-blue" }
      dark:
        bindings:
          surface-primary:       { var: "--color-blue-850" }
          surface-secondary:     { var: "--color-blue-800" }
          surface-tertiary:      { var: "--color-blue-800" }
          surface-raised:        { var: "--color-blue-850" }
          surface-muted:         { var: "--color-blue-800" }
          text-primary:          { var: "--color-blue-050" }
          text-secondary:        { var: "--color-blue-400" }
          text-tertiary:         { var: "--color-blue-500" }
          text-inverse:          { var: "--color-blue-950" }
          border-subtle:         { var: "--color-blue-600" }
          border-strong:         { var: "--color-blue-300" }
          accent-primary:        { var: "--color-accent-dark" }
          accent-interactive:    { var: "--color-accent-hover" }
          accent-heroes:         { var: "--color-blue-050" }
          focus-ring:            { var: "--color-blue-400" }
          button-primary-bg:     { var: "--color-blue-050" }
          button-primary-text:   { var: "--color-blue-950" }
          switch-active-bg:      { var: "--color-state-focus-blue" }

  # ------------------------------------------------------------
  # default — Principal light theme.  Warm-ivory ground.
  # `editorial` is currently a CSS alias of this theme (handled
  # in the .css generator, not in the YAML).
  # ------------------------------------------------------------
  default:
    description: "Principal light theme. Default warm-ivory page ground for marketing, editorial, conversion. `editorial` is a CSS alias of this theme."
    modes:
      light:
        bindings:
          surface-primary:       { var: "--color-neutral-050" }
          surface-secondary:     { var: "--color-neutral-100" }
          surface-tertiary:      { var: "--color-neutral-150" }
          surface-raised:        { var: "--color-neutral-000" }
          surface-muted:         { var: "--color-neutral-150" }
          text-primary:          { var: "--color-neutral-950" }
          text-secondary:        { var: "--color-neutral-750" }
          text-tertiary:         { var: "--color-neutral-600" }
          text-inverse:          { var: "--color-blue-050" }
          border-subtle:         { var: "--color-neutral-400" }
          border-strong:         { var: "--color-neutral-700" }
          accent-primary:        { var: "--color-accent-primary" }
          accent-interactive:    { var: "--color-accent-interactive" }
          accent-heroes:         { var: "--color-accent-primary" }
          focus-ring:            { var: "--color-neutral-450" }
          button-primary-bg:     { var: "--color-blue-750" }
          button-primary-text:   { var: "--color-blue-050" }
          button-secondary-bg:   { var: "--color-blue-200" }
          button-secondary-text: { var: "--color-blue-650" }
          button-tertiary-border: { var: "--color-neutral-400" }
          switch-active-bg:      { var: "--color-state-focus-blue" }
      dark:
        bindings:
          surface-primary:       { var: "--color-blue-950" }
          surface-secondary:     { var: "--color-blue-900" }
          surface-tertiary:      { var: "--color-blue-800" }
          surface-raised:        { var: "--color-blue-850" }
          surface-muted:         { var: "--color-blue-900" }
          text-primary:          { var: "--color-blue-050" }
          text-secondary:        { var: "--color-blue-400" }
          text-tertiary:         { var: "--color-blue-500" }
          text-inverse:          { var: "--color-blue-950" }
          border-subtle:         { var: "--color-blue-600" }
          border-strong:         { var: "--color-blue-300" }
          accent-primary:        { var: "--color-accent-dark" }
          accent-interactive:    { var: "--color-accent-hover" }
          accent-heroes:         { var: "--color-blue-050" }
          focus-ring:            { var: "--color-blue-400" }
          button-primary-bg:     { var: "--color-blue-050" }
          button-primary-text:   { var: "--color-blue-950" }
          button-secondary-bg:   { var: "--color-blue-750" }
          button-secondary-text: { var: "--color-blue-050" }
          switch-active-bg:      { var: "--color-state-focus-blue" }

  # ------------------------------------------------------------
  # punctuation — Light punctuation interjection.
  # Dark mode mirrors light (no visual change on mode flip).
  # ------------------------------------------------------------
  punctuation:
    description: "Light punctuation interjection. Sits between `default` and `deep` in scroll rhythm."
    modes:
      light:
        bindings:
          surface-primary:       { var: "--color-neutral-150" }
          surface-secondary:     { var: "--color-neutral-200" }
          surface-tertiary:      { var: "--color-neutral-250" }
          surface-raised:        { var: "--color-neutral-050" }
          surface-muted:         { var: "--color-neutral-200" }
          text-primary:          { var: "--color-neutral-950" }
          text-secondary:        { var: "--color-neutral-750" }
          text-tertiary:         { var: "--color-neutral-600" }
          text-inverse:          { var: "--color-blue-050" }
          border-subtle:         { var: "--color-neutral-450" }
          border-strong:         { var: "--color-neutral-700" }
          accent-primary:        { var: "--color-accent-primary" }
          accent-interactive:    { var: "--color-accent-interactive" }
          accent-heroes:         { var: "--color-accent-primary" }
          focus-ring:            { var: "--color-neutral-550" }
          button-primary-bg:     { var: "--color-blue-750" }
          button-primary-text:   { var: "--color-blue-050" }
          switch-active-bg:      { var: "--color-state-focus-blue" }
      dark:
        bindings:
          surface-primary:       { var: "--color-neutral-150" }
          surface-secondary:     { var: "--color-neutral-200" }
          surface-tertiary:      { var: "--color-neutral-250" }
          surface-raised:        { var: "--color-neutral-050" }
          surface-muted:         { var: "--color-neutral-200" }
          text-primary:          { var: "--color-neutral-950" }
          text-secondary:        { var: "--color-neutral-750" }
          text-tertiary:         { var: "--color-neutral-600" }
          text-inverse:          { var: "--color-blue-050" }
          border-subtle:         { var: "--color-neutral-450" }
          border-strong:         { var: "--color-neutral-700" }
          accent-primary:        { var: "--color-accent-primary" }
          accent-interactive:    { var: "--color-accent-interactive" }
          accent-heroes:         { var: "--color-accent-primary" }
          focus-ring:            { var: "--color-neutral-550" }
          button-primary-bg:     { var: "--color-blue-750" }
          button-primary-text:   { var: "--color-blue-050" }
          switch-active-bg:      { var: "--color-state-focus-blue" }

  # ------------------------------------------------------------
  # statement — High-contrast neutral feature panel.
  # Dark mode mirrors light (no visual change on mode flip).
  # ------------------------------------------------------------
  statement:
    description: "High-contrast neutral feature panel. Pushes ink to absolute black for maximum statement contrast."
    modes:
      light:
        bindings:
