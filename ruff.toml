line-length = 120
target-version = "py314"
preview = true
extend-exclude = [".claude/skills/ui-ux-pro-max", ".cursor/skills"]

[lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM",
    "D", "DOC", "E", "EM", "ERA", "F", "FIX", "FLY", "FURB",
    "G", "I", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL",
    "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF",
    "T10", "T20", "TC", "TD", "TID", "TRY", "UP",
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on first line of multi-line docstring)
]

[format]
quote-style = "double"


[lint.flake8-type-checking]
runtime-evaluated-decorators = ["typeguard.typechecked"]
runtime-evaluated-base-classes = ["typing.TypedDict"]
